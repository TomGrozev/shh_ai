name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

permissions:
  contents: read

# The NER model the test job exercises, kept in one place so the Bumblebee cache
# key, the tests and the Dockerfile ARG defaults cannot drift apart. Must match
# the Dockerfile's PII_NER_MODEL / PII_NER_MODEL_REVISION defaults.
env:
  PII_NER_MODEL: gravitee-io/bert-small-pii-detection
  PII_NER_MODEL_REVISION: ""

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          # Current Elixir (ADR 0017); matches the deployment image.
          # mix.exs accepts anything >= 1.19.4.
          elixir-version: "1.20.3"
          otp-version: "28"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Bumblebee models
        uses: actions/cache@v4
        with:
          path: ~/.cache/bumblebee
          key: ${{ runner.os }}-bumblebee-${{ env.PII_NER_MODEL }}-${{ env.PII_NER_MODEL_REVISION }}
          restore-keys: |
            ${{ runner.os }}-bumblebee-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Lint (Credo)
        run: mix credo --strict

      - name: Run tests
        run: mix test
